listener 1883
protocol mqtt

# Bring-up default: anonymous LAN access, no TLS. Fine on a trusted LAN;
# switch to the hardened settings below before exposing the broker.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout

# --- TLS (Phase 6) -------------------------------------------------------
# Serve MQTT over TLS on 8883. Then set netsocket Preferences →
# Smart Home → MQTT TLS = true (and MQTT CA File to the CA path).
# Generate a CA + server cert, place them under mosquitto/certs/.
#
#listener 8883
#cafile   /mosquitto/config/certs/ca.crt
#certfile /mosquitto/config/certs/server.crt
#keyfile  /mosquitto/config/certs/server.key
#tls_version tlsv1.2

# --- Authentication + per-device ACL (Phase 6) ---------------------------
# Disable anonymous access, require passwords, and scope each device to its
# own subtree via mosquitto/acl. Create the password file with:
#   mosquitto_passwd -c mosquitto/passwd netsocket-server
#   mosquitto_passwd    mosquitto/passwd <chipId>
#
#allow_anonymous false
#password_file /mosquitto/config/passwd
#acl_file      /mosquitto/config/acl