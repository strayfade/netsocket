name: Android APK

# Rebuilds the served APK whenever the app changes and commits it back,
# so /downloads/android and the overnight self-updater always have a fresh
# artifact. Pushes made with GITHUB_TOKEN don't retrigger workflows, and
# the message guard below covers manual re-pushes, so this cannot loop on
# its own commit. All builds share the pinned debug keystore
# (extensions/android/debug.keystore), keeping update signatures stable.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[android-apk]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Build served APK
        working-directory: extensions/android
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit rebuilt APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions/android/dist/netsocket-android.apk
          git diff --cached --quiet || git commit -m "chore(android): rebuild served APK [android-apk]"
          git push
