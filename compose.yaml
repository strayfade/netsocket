version: "3.8"
services:
  netsocket:
    image: ghcr.io/strayfade/netsocket:latest
    container_name: netsocket
    ports:
      - 4675:4675
    # Unprivileged: the node types that needed to spawn shell/JS (System/Run
    # Command, Debugging/Run Javascript) were removed on 2026-11-24. 568:568 is
    # the uid/gid the TrueNAS "apps" dataset uses, so the bind-mount deploy and
    # a fresh named volume both work.
    user: "568:568"
    environment:
      - PORT=4675
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/netsocket/data
      - HOME=/tmp
      # Cookies are Secure by default since 2026-11-24. Set COOKIE_SECURE=0 only
      # if a client must reach this instance over plain HTTP (a LAN kiosk on
      # http://); leaving it unset also turns on trust-proxy attribution, so the
      # per-IP login limiter sees the real visitor rather than the gateway.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - netsocket-data:/netsocket/data
    depends_on:
      perms:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: always
  # One-shot, root, exits immediately: hands the data volume to the app uid so
  # the server never needs to run as root (and a fresh volume is not root-owned).
  perms:
    image: alpine:3.20
    container_name: netsocket-perms
    user: "0:0"
    command: ["sh", "-c", "chown -R 568:568 /data"]
    volumes:
      - netsocket-data:/data
    restart: "no"
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: netsocket-mosquitto
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: always
  # Optional off-the-shelf Zigbee bridge. Requires a USB coordinator; start
  # with: docker compose --profile zigbee up -d
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: netsocket-z2m
    profiles: ["zigbee"]
    ports:
      - 8080:8080
    volumes:
      - ./z2m/configuration.yaml:/app/configuration.yaml
      - z2m-data:/app/data
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0 # change to your coordinator path
    depends_on:
      - mosquitto
    restart: always
volumes:
  netsocket-data:
  mosquitto-data:
  z2m-data:
