; Zigbee coordinator firmware for the Seeed XIAO ESP32-C6.
;
; Turns the board into a Zigbee Coordinator (ZC) that forms its own network,
; tracks joining devices, drives them over ZCL, and bridges them into
; netsocket over MQTT. A line-oriented command protocol (see README.md) is
; served on the native USB-CDC port.
;
; Why this platform: the official `platform = espressif32` ships ESP-IDF 4.4.6,
; which predates the ESP32-C6 and has no 802.15.4 support. The community
; pioarduino distribution tracks Arduino 3.3.12 / ESP-IDF 5.5.5, and esp-zigbee
; needs IDF >= 5.2. This is a plain PlatformIO project (`pio run`), it just
; uses the ESP-IDF framework rather than Arduino.
;
; Build:    pio run
; Flash:    pio run -t upload        (device must be connected; XIAO C6 needs no
;                                     manual BOOT press for a normal USB flash)
; Monitor:  pio device monitor -b 115200

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = espidf

board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters =
    time
    esp32_exception_decoder
