; Reference firmware for bespoke ESP32-C3 devices (light switch, button).
; Target: ESP32-C3 (WiFi). See README.md for wiring and the pairing flow.
;
; Build:   pio run -e switch      (or -e button)
; Flash:   pio run -e switch -t upload
; Monitor: pio device monitor -b 115200

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    arduino-libraries/ArduinoOTA@^1.1.0

[env:switch]
build_flags = ${env.build_flags} -D DEVICE_KIND_SWITCH=1
build_src_filter = +<common/> +<switch.cpp>

[env:button]
build_flags = ${env.build_flags} -D DEVICE_KIND_BUTTON=1
build_src_filter = +<common/> +<button.cpp>